name: MPOps Performance CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  mpops-performance:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pandas numpy scikit-learn
    - name: Run model evaluation
      run: |
        python scripts/run_eval.py `
          --data tests/eval_data.csv `
          --output current_perf.json

    - name: MPOps Commit
      run: |
        mpops commit `
          --eval current_perf.json `
          --model-name dgr-ai-intent `
          --message "CI performance snapshot"
    - name: Fetch baseline performance
      run: |
        mpops fetch-baseline `
          --branch main `
          --output baseline_perf.json
  - name: MPOps Semantic Diff
      run: |
        mpops diff `
          --baseline baseline_perf.json `
          --current current_perf.json `
          --accuracy-threshold 0.02 `
          --fail-on-regression true

  
    - name: Update MPOps Lineage
      if: github.ref == 'refs/heads/main'
      run: |
        mpops update-lineage `
          --current current_perf.json
